<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Administration Flexibat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root { --navy: #17417B; --cyan: #02AFF3; --laterite: #B8492E; --sand: #F2F1EC; --ink: #1C1F26; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif; background: var(--navy); color: var(--ink);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .login-box { background: #fff; border-radius: 6px; padding: 40px; width: 360px; }
  .login-box img { height: 40px; width: auto; display: block; margin-bottom: 20px; }
  .subtitle { font-size: 13px; color: #6B6A63; margin-bottom: 28px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field input {
    width: 100%; border: 1px solid #E4E1D6; border-radius: 3px; padding: 10px 12px;
    font-family: 'Inter', sans-serif; font-size: 14px; background: var(--sand);
  }
  button {
    width: 100%; background: var(--laterite); color: #fff; border: none;
    padding: 12px; border-radius: 3px; font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 8px;
  }
  .error { color: var(--laterite); font-size: 13px; margin-top: 12px; display: none; }
</style>
</head>
<body>
  <div class="login-box">
    <img src="/images/flexibat-logo.png" alt="Flexibat">
    <div class="subtitle">Espace de gestion</div>
    <form id="login-form">
      <div class="field">
        <label>Nom d'utilisateur</label>
        <input type="text" id="username" required autofocus>
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit">Se connecter</button>
      <div class="error" id="error-msg"></div>
    </form>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      errorMsg.style.display = 'none';

      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (res.ok) {
        window.location.href = '/admin/';
      } else {
        const data = await res.json();
        errorMsg.textContent = data.error || 'Erreur de connexion';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
