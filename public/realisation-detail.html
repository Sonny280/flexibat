<!DOCTYPE html>
<html lang="fr" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Détail de la réalisation — Flexibat</title>
<meta name="description" content="Détail d'une réalisation Flexibat à Abidjan, Côte d'Ivoire.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Flexibat">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="Détail de la réalisation — Flexibat">
<meta property="og:description" content="Détail d'une réalisation Flexibat à Abidjan, Côte d'Ivoire.">
<meta property="og:image" content="https://www.flexibat.ci/images/flexibat-logo.png">
<meta property="og:url" content="https://www.flexibat.ci/realisations.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="images/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="images/favicon.png">
<style>
  .detail-wrap { max-width: 1180px; margin: 0 auto; padding: 48px; }
  .detail-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 48px; }
  .detail-main-photo { width: 100%; height: 420px; object-fit: cover; border-radius: 6px; background: #E4E1D6; }
  .detail-thumbs { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .detail-thumbs img { width: 84px; height: 64px; object-fit: cover; border-radius: 3px; cursor: pointer; opacity: 0.7; border: 2px solid transparent; }
  .detail-thumbs img.active { opacity: 1; border-color: var(--laterite); }
  .detail-sidebar { background: #fff; border: 1px solid #E4E1D6; border-radius: 6px; padding: 32px; align-self: start; }
  .detail-category { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #fff; background: var(--laterite); padding: 5px 12px; border-radius: 20px; margin-bottom: 14px; }
  .detail-sidebar h1 { font-size: 24px; margin: 4px 0 6px; }
  .detail-lieu { color: #6B6A63; font-size: 14px; margin-bottom: 24px; }
  .detail-desc { margin-top: 32px; }
  .detail-desc h3 { font-size: 18px; margin-bottom: 12px; }
  .detail-desc p { color: #5C5B54; font-size: 15px; line-height: 1.6; }
  @media (max-width: 900px) { .detail-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="site-header"></div>
<div class="page-banner" style="padding: 28px 48px;">
  <div class="breadcrumb"><a href="index.html">Accueil</a> / <a href="realisations.html">Réalisations</a> / <span id="crumb-title">...</span></div>
</div>

<div class="detail-wrap" id="detail-content">
  <p>Chargement de la réalisation...</p>
</div>

<div id="site-footer"></div>
<script src="includes.js"></script>
<script src="app.js" defer></script>
<script src="animations.js" type="module"></script>
<script>
  const CATEGORY_LABELS = { BTP: 'BTP', VRD: 'VRD', Terrain: 'VRD', FlexiPlomb: 'FlexiPlomb' };

  (async function () {
    const id = new URLSearchParams(window.location.search).get('id');
    const container = document.getElementById('detail-content');
    if (!id) { container.innerHTML = '<p>Réalisation non spécifiée.</p>'; return; }

    try {
      const res = await fetch(`/api/realisations/${id}`);
      if (!res.ok) { container.innerHTML = '<p>Cette réalisation n\'existe plus ou a été retirée.</p>'; return; }
      const r = await res.json();
      document.title = `${r.titre} — Flexibat`;
      document.getElementById('crumb-title').textContent = r.titre;

      const photos = (r.photos && r.photos.length > 0) ? r.photos : ['https://picsum.photos/seed/real-' + r.id + '/900/600'];

      const settingsRes = await fetch('/api/settings');
      const settings = await settingsRes.json();
      const waMessage = encodeURIComponent(`Bonjour, votre réalisation "${r.titre}" m'intéresse. Pourriez-vous m'en dire plus sur un projet similaire ?`);

      container.innerHTML = `
        <div class="detail-grid">
          <div>
            <img class="detail-main-photo" id="main-photo" src="${photos[0]}" alt="${r.titre}">
            <div class="detail-thumbs">
              ${photos.map((p, i) => `<img src="${p}" class="${i === 0 ? 'active' : ''}" data-src="${p}">`).join('')}
            </div>
            <div class="detail-desc">
              <h3>Description</h3>
              <p>${r.description || "Aucune description fournie pour le moment."}</p>
            </div>
          </div>
          <div class="detail-sidebar">
            <span class="detail-category">${CATEGORY_LABELS[r.categorie] || r.categorie}</span>
            <h1>${r.titre}</h1>
            <p class="detail-lieu">${r.lieu || ''}</p>
            ${(r.client || r.duree || r.superficie) ? `
              <ul style="list-style:none; margin:0 0 24px; padding:16px 0; border-top:1px solid #E4E1D6; border-bottom:1px solid #E4E1D6;">
                ${r.client ? `<li style="margin-bottom:8px; font-size:14px;"><strong>Client :</strong> ${r.client}</li>` : ''}
                ${r.duree ? `<li style="margin-bottom:8px; font-size:14px;"><strong>Durée :</strong> ${r.duree}</li>` : ''}
                ${r.superficie ? `<li style="font-size:14px;"><strong>Superficie :</strong> ${r.superficie}</li>` : ''}
              </ul>
            ` : ''}
            <a href="https://wa.me/${settings.whatsapp}?text=${waMessage}" target="_blank" class="btn-primary" style="display:block; text-align:center;">Discuter d'un projet similaire</a>
          </div>
        </div>
      `;

      document.querySelectorAll('.detail-thumbs img').forEach(thumb => {
        thumb.addEventListener('click', () => {
          document.getElementById('main-photo').src = thumb.dataset.src;
          document.querySelectorAll('.detail-thumbs img').forEach(i => i.classList.remove('active'));
          thumb.classList.add('active');
        });
      });
    } catch (e) {
      container.innerHTML = '<p>Une erreur est survenue lors du chargement.</p>';
      console.error(e);
    }
  })();
</script>
</body>
</html>
