<!DOCTYPE html>
<html lang="fr" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actualités — Flexibat</title>
<meta name="description" content="Actualités, annonces et offres d'emploi de Flexibat — BTP, VRD et FlexiPlomb à Abidjan.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Flexibat">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="Actualités — Flexibat">
<meta property="og:description" content="Actualités, annonces et offres d'emploi de Flexibat — BTP, VRD et FlexiPlomb à Abidjan.">
<meta property="og:image" content="https://www.flexibat.ci/images/flexibat-logo.png">
<meta property="og:url" content="https://www.flexibat.ci/actualites.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="images/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="images/favicon.png">
<style>
  .actus-wrap { max-width: 900px; margin: 0 auto; padding: 56px 48px 96px; }
  .actus-filters { display: flex; gap: 10px; margin-bottom: 36px; flex-wrap: wrap; }
  .actus-filters button {
    border: 1px solid #E4E1D6; background: #fff; padding: 9px 18px; border-radius: 20px;
    font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink);
  }
  .actus-filters button.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .actu-card { background: #fff; border: 1px solid #E4E1D6; border-radius: 6px; overflow: hidden; margin-bottom: 22px; }
  .actu-card img { width: 100%; max-height: 320px; object-fit: cover; display: block; }
  .actu-card-body { padding: 22px 24px; }
  .actu-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .actu-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 4px 10px; border-radius: 12px; }
  .actu-tag.Info { background: #E0EEF5; color: var(--navy); }
  .actu-tag.Recrutement { background: #E8F0E4; color: var(--olive); }
  .actu-tag.Stage { background: #F5E9E0; color: var(--laterite); }
  .actu-date { font-size: 12px; color: #6B6A63; }
  .actu-card h3 { font-size: 19px; margin-bottom: 10px; }
  .actu-card p { font-size: 14px; color: #5C5B54; line-height: 1.6; white-space: pre-line; }
</style>
</head>
<body>

<div id="site-header"></div>
<div class="page-banner">
  <div class="breadcrumb"><a href="index.html">Accueil</a> / Actualités</div>
  <h1>Actualités</h1>
  <p>Informations, annonces et offres d'emploi ou de stage chez Flexibat.</p>
</div>

<div class="actus-wrap">
  <div class="actus-filters reveal" id="filters">
    <button data-cat="" class="active">Tout</button>
    <button data-cat="Info">Infos</button>
    <button data-cat="Recrutement">Recrutement</button>
    <button data-cat="Stage">Stages</button>
  </div>
  <div id="actus-list">
    <p style="color:#6B6A63;">Chargement...</p>
  </div>
</div>

<div id="site-footer"></div>
<script src="includes.js"></script>
<script src="app.js" defer></script>
<script src="animations.js" type="module"></script>
<script>
  let allActus = [];

  function render(list) {
    const el = document.getElementById('actus-list');
    if (list.length === 0) {
      el.innerHTML = '<p style="color:#6B6A63;">Aucune actualité publiée pour le moment.</p>';
      return;
    }
    el.innerHTML = list.map(a => `
      <div class="actu-card">
        ${a.photos && a.photos[0] ? `<img src="${a.photos[0]}" alt="${a.titre}">` : ''}
        <div class="actu-card-body">
          <div class="actu-top">
            <span class="actu-tag ${a.categorie}">${a.categorie === 'Info' ? 'Info' : a.categorie}</span>
            <span class="actu-date">${new Date(a.createdAt).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })}</span>
          </div>
          <h3>${a.titre}</h3>
          <p>${a.contenu || ''}</p>
        </div>
      </div>
    `).join('');
  }

  (async function () {
    const res = await fetch('/api/actualites');
    allActus = await res.json();
    render(allActus);

    document.querySelectorAll('#filters button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const cat = btn.dataset.cat;
        render(cat ? allActus.filter(a => a.categorie === cat) : allActus);
      });
    });
  })();
</script>
</body>
</html>
