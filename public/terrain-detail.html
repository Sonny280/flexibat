<!DOCTYPE html>
<html lang="fr" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Détail du terrain — Flexibat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .detail-wrap { max-width: 1180px; margin: 0 auto; padding: 48px; }
  .detail-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 48px; }
  .detail-main-photo { width: 100%; height: 420px; object-fit: cover; border-radius: 6px; background: #E4E1D6; }
  .detail-thumbs { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .detail-thumbs img { width: 84px; height: 64px; object-fit: cover; border-radius: 3px; cursor: pointer; opacity: 0.7; border: 2px solid transparent; }
  .detail-thumbs img.active { opacity: 1; border-color: var(--laterite); }
  .detail-sidebar { background: #fff; border: 1px solid #E4E1D6; border-radius: 6px; padding: 32px; align-self: start; }
  .detail-price { font-family: 'Fraunces', serif; font-size: 30px; color: var(--navy); margin-bottom: 6px; }
  .detail-payment { color: var(--olive); font-size: 14px; margin-bottom: 24px; }
  .detail-spec-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #E4E1D6; font-size: 14px; }
  .detail-spec-row span:first-child { color: #6B6A63; }
  .detail-spec-row span:last-child { font-weight: 600; }
  .detail-desc { margin-top: 32px; }
  .detail-desc h3 { font-size: 18px; margin-bottom: 12px; }
  .detail-desc p { color: #5C5B54; font-size: 15px; line-height: 1.6; }
</style>
</head>
<body>

<div id="site-header"></div>
<div class="page-banner" style="padding: 28px 48px;">
  <div class="breadcrumb"><a href="index.html">Accueil</a> / <a href="terrains.html">Terrains</a> / <span id="crumb-title">...</span></div>
</div>

<div class="detail-wrap" id="detail-content">
  <p>Chargement du terrain...</p>
</div>

<div id="site-footer"></div>
<script src="includes.js"></script>
<script src="app.js" defer></script>
<script src="animations.js" type="module"></script>
<script>
  function statutLabel(s) { return { disponible: 'Disponible', reserve: 'Réservé', vendu: 'Vendu' }[s] || s; }

  (async function () {
    const id = new URLSearchParams(window.location.search).get('id');
    const container = document.getElementById('detail-content');
    if (!id) { container.innerHTML = '<p>Terrain non spécifié.</p>'; return; }

    try {
      const res = await fetch(`/api/terrains/${id}`);
      if (!res.ok) { container.innerHTML = '<p>Ce terrain n\'existe plus ou a été retiré.</p>'; return; }
      const t = await res.json();
      document.title = `${t.titre} — Flexibat`;
      document.getElementById('crumb-title').textContent = t.titre;

      const photos = (t.photos && t.photos.length > 0) ? t.photos : ['https://picsum.photos/seed/terrain-' + t.id + '/900/600'];

      const settingsRes = await fetch('/api/settings');
      const settings = await settingsRes.json();
      const waMessage = encodeURIComponent(`Bonjour, je suis intéressé(e) par le terrain "${t.titre}" (${t.ville}, ${t.superficie}).`);

      container.innerHTML = `
        <div class="detail-grid">
          <div>
            <img class="detail-main-photo" id="main-photo" src="${photos[0]}" alt="${t.titre}">
            <div class="detail-thumbs">
              ${photos.map((p, i) => `<img src="${p}" class="${i === 0 ? 'active' : ''}" data-src="${p}">`).join('')}
            </div>
            <div class="detail-desc">
              <h3>Description</h3>
              <p>${t.description || "Aucune description fournie pour le moment."}</p>
            </div>
          </div>
          <div class="detail-sidebar">
            <span class="terrain-status ${t.statut === 'disponible' ? 'disponible' : 'reserve'}">${statutLabel(t.statut)}</span>
            <h1 style="font-size:24px; margin:14px 0 4px;">${t.titre}</h1>
            <p style="color:#6B6A63; font-size:14px; margin-bottom:20px;">${t.ville}${t.site ? ', ' + t.site : ''}</p>
            <div class="detail-price">${t.prix}</div>
            <div class="detail-payment">${t.paiement || ''}</div>
            <div class="detail-spec-row"><span>Superficie</span><span>${t.superficie}</span></div>
            <div class="detail-spec-row"><span>Document</span><span>${t.document}</span></div>
            <div class="detail-spec-row"><span>Ville</span><span>${t.ville}</span></div>
            <a href="https://wa.me/${settings.whatsapp}?text=${waMessage}" target="_blank" class="btn-primary" style="display:block; text-align:center; margin-top:24px;">Je suis intéressé(e)</a>
          </div>
        </div>
      `;

      document.querySelectorAll('.detail-thumbs img').forEach(thumb => {
        thumb.addEventListener('click', () => {
          document.getElementById('main-photo').src = thumb.dataset.src;
          document.querySelectorAll('.detail-thumbs img').forEach(i => i.classList.remove('active'));
          thumb.classList.add('active');
        });
      });
    } catch (e) {
      container.innerHTML = '<p>Une erreur est survenue lors du chargement.</p>';
      console.error(e);
    }
  })();
</script>
</body>
</html>
