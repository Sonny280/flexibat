<!DOCTYPE html>
<html lang="fr" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nos réalisations — Flexibat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .realisations-wrap { max-width: 1180px; margin: 0 auto; padding: 56px 48px 96px; }
  .realisations-filters { display: flex; gap: 10px; margin-bottom: 36px; flex-wrap: wrap; }
  .realisations-filters button {
    border: 1px solid #E4E1D6; background: #fff; padding: 9px 18px; border-radius: 20px;
    font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink);
  }
  .realisations-filters button.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .realisations-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .realisation-card { background: #fff; border: 1px solid #E4E1D6; border-radius: 6px; overflow: hidden; display: block; color: inherit; text-decoration: none; transition: box-shadow 0.2s ease, transform 0.2s ease; }
  .realisation-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.08); transform: translateY(-2px); }
  .realisation-card img { width: 100%; height: 200px; object-fit: cover; display: block; }
  .realisation-card-body { padding: 20px; }
  .realisation-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--laterite); margin-bottom: 8px; }
  .realisation-card h3 { font-size: 17px; margin-bottom: 6px; }
  .realisation-card .lieu { font-size: 13px; color: #6B6A63; margin-bottom: 10px; }
  .realisation-card p { font-size: 13px; color: #5C5B54; }
  @media (max-width: 900px) { .realisations-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="site-header"></div>
<div class="page-banner">
  <div class="breadcrumb"><a href="index.html">Accueil</a> / Réalisations</div>
  <h1>Nos réalisations</h1>
  <p>Chantiers BTP, terrains livrés et interventions FlexiPlomb menés à bien.</p>
</div>

<div class="realisations-wrap">
  <div class="realisations-filters reveal" id="filters">
    <button data-cat="" class="active">Tout</button>
    <button data-cat="BTP">BTP</button>
    <button data-cat="VRD">VRD</button>
    <button data-cat="FlexiPlomb">FlexiPlomb</button>
  </div>
  <div class="realisations-grid" id="realisations-grid">
    <p style="color:#6B6A63;">Chargement...</p>
  </div>
</div>

<div id="site-footer"></div>
<script src="includes.js"></script>
<script src="app.js" defer></script>
<script src="animations.js" type="module"></script>
<script>
  let allRealisations = [];

  function render(list) {
    const grid = document.getElementById('realisations-grid');
    if (list.length === 0) {
      grid.innerHTML = '<p style="color:#6B6A63;">Aucune réalisation publiée pour le moment.</p>';
      return;
    }
    grid.innerHTML = list.map(r => `
      <a class="realisation-card" href="realisation-detail.html?id=${r.id}">
        <img src="${(r.photos && r.photos[0]) || 'https://picsum.photos/seed/real-' + r.id + '/500/380'}" alt="${r.titre}">
        <div class="realisation-card-body">
          <div class="realisation-tag">${r.categorie}</div>
          <h3>${r.titre}</h3>
          <div class="lieu">${r.lieu || ''}</div>
          <p>${r.description || ''}</p>
        </div>
      </a>
    `).join('');
  }

  (async function () {
    const res = await fetch('/api/realisations');
    allRealisations = await res.json();
    render(allRealisations);

    document.querySelectorAll('#filters button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const cat = btn.dataset.cat;
        render(cat ? allRealisations.filter(r => r.categorie === cat) : allRealisations);
      });
    });
  })();
</script>
</body>
</html>
