<!DOCTYPE html>
<html lang="fr" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terrains disponibles — Flexibat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="site-header"></div>
<div class="page-banner">
  <div class="breadcrumb"><a href="index.html">Accueil</a> / Terrains</div>
  <h1>Terrains disponibles</h1>
  <p>Des lots titrés (ACD, ATT) à travers la Côte d'Ivoire, payables cash ou échelonnés jusqu'à 25 mois.</p>
</div>

<div class="filter-bar reveal">
  <div class="filter-field">
    <label>Ville</label>
    <select id="filter-ville"><option value="">Toutes les villes</option></select>
  </div>
  <div class="filter-field">
    <label>Type de document</label>
    <select id="filter-document">
      <option value="">Tous documents</option>
      <option value="ACD">ACD</option>
      <option value="ATT">ATT</option>
      <option value="CF">CF</option>
    </select>
  </div>
  <div class="filter-field">
    <label>Statut</label>
    <select id="filter-statut">
      <option value="">Tous statuts</option>
      <option value="disponible">Disponible</option>
      <option value="reserve">Réservé</option>
      <option value="vendu">Vendu</option>
    </select>
  </div>
  <button class="filter-btn" id="filter-btn">Filtrer</button>
</div>

<div class="terrain-catalogue">
  <div class="terrain-count" id="terrain-count">Chargement...</div>
  <div class="terrain-grid" id="terrain-grid"></div>
</div>

<div class="urgency-band reveal" style="background: var(--navy);">
  <div>
    <h3>Vous ne trouvez pas ce qu'il vous faut ?</h3>
    <p>Contactez-nous, de nouveaux sites sont régulièrement ajoutés.</p>
  </div>
  <a href="#" data-whatsapp-link target="_blank" class="btn-white" style="color:var(--navy);">Discuter sur WhatsApp</a>
</div>

<div id="site-footer"></div>
<script src="includes.js"></script>
<script src="app.js" defer></script>
<script src="animations.js" type="module"></script>
<script>
  let allTerrains = [];

  function statutLabel(s) { return { disponible: 'Disponible', reserve: 'Réservé', vendu: 'Vendu' }[s] || s; }
  function statutClass(s) { return { disponible: 'disponible', reserve: 'reserve', vendu: 'reserve' }[s] || ''; }

  function render(list) {
    const grid = document.getElementById('terrain-grid');
    const count = document.getElementById('terrain-count');
    count.textContent = `${list.length} terrain${list.length > 1 ? 's' : ''} trouvé${list.length > 1 ? 's' : ''}`;

    if (list.length === 0) {
      grid.innerHTML = '<p style="color:#6B6A63;">Aucun terrain ne correspond à ces critères pour le moment.</p>';
      return;
    }

    grid.innerHTML = list.map(t => `
      <div class="terrain-card">
        <img src="${(t.photos && t.photos[0]) || 'https://picsum.photos/seed/terrain-' + t.id + '/500/380'}" alt="${t.titre}">
        <div class="terrain-card-body">
          <span class="terrain-status ${statutClass(t.statut)}">${statutLabel(t.statut)}</span>
          <h3>${t.titre}</h3>
          <div class="location">${t.ville}${t.site ? ', ' + t.site : ''}</div>
          <div class="terrain-specs">
            <span><strong>${t.superficie}</strong></span>
            <span>${t.document}</span>
          </div>
          <div class="terrain-card-price">${t.prix}</div>
          <div class="terrain-card-payment">${t.paiement || ''}</div>
          <a href="terrain-detail.html?id=${t.id}" class="terrain-card-cta">Voir le détail</a>
        </div>
      </div>
    `).join('');
  }

  function applyFilters() {
    const ville = document.getElementById('filter-ville').value;
    const doc = document.getElementById('filter-document').value;
    const statut = document.getElementById('filter-statut').value;
    const filtered = allTerrains.filter(t =>
      (!ville || t.ville === ville) &&
      (!doc || t.document === doc) &&
      (!statut || t.statut === statut)
    );
    render(filtered);
  }

  (async function () {
    const res = await fetch('/api/terrains');
    allTerrains = await res.json();

    const villes = [...new Set(allTerrains.map(t => t.ville))];
    const villeSelect = document.getElementById('filter-ville');
    villes.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = v;
      villeSelect.appendChild(opt);
    });

    render(allTerrains);
    document.getElementById('filter-btn').addEventListener('click', applyFilters);
  })();
</script>
</body>
</html>
